<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      .flow-beam { stroke-dasharray: 6 12; animation: flow 2s linear infinite; }
      .letter-pulse { animation: lpulse 3s infinite ease-in-out; }
      @keyframes flow { to { stroke-dashoffset: -36; } }
      @keyframes lpulse { 0%, 100% { fill: #00f0ff; } 50% { fill: #ffffff; } }
    </style>
  </defs>

  <rect width="1000" height="240" rx="10" fill="#060913" stroke="#1f293d"/>

  <!-- Step A: All Models -->
  <g transform="translate(40, 45)">
    <circle cx="30" cy="30" r="24" fill="#0d1526" stroke="#00f0ff" stroke-width="1.5"/>
    <text x="30" y="38" fill="#00f0ff" font-size="20" font-weight="900" text-anchor="middle" class="mono letter-pulse">A</text>
    <text x="30" y="80" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle" class="mono">All models</text>
    <text x="30" y="105" fill="#8b949e" font-size="11" text-anchor="middle" class="mono">Every free model joins</text>
  </g>

  <line x1="120" y1="75" x2="220" y2="75" stroke="#00f0ff" stroke-width="2" class="flow-beam"/>

  <!-- Step S: Systems -->
  <g transform="translate(230, 45)">
    <circle cx="30" cy="30" r="24" fill="#0d1526" stroke="#00f0ff" stroke-width="1.5"/>
    <text x="30" y="38" fill="#00f0ff" font-size="20" font-weight="900" text-anchor="middle" class="mono letter-pulse">S</text>
    <text x="30" y="80" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle" class="mono">Systems</text>
    <text x="30" y="105" fill="#8b949e" font-size="11" text-anchor="middle" class="mono">Files, terminal, MCP</text>
  </g>

  <line x1="310" y1="75" x2="410" y2="75" stroke="#7000ff" stroke-width="2" class="flow-beam"/>

  <!-- Step T: Thinking -->
  <g transform="translate(420, 45)">
    <circle cx="30" cy="30" r="24" fill="#0d1526" stroke="#7000ff" stroke-width="1.5"/>
    <text x="30" y="38" fill="#7000ff" font-size="20" font-weight="900" text-anchor="middle" class="mono letter-pulse">T</text>
    <text x="30" y="80" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle" class="mono">Thinking</text>
    <text x="30" y="105" fill="#8b949e" font-size="11" text-anchor="middle" class="mono">Simultaneous drafts</text>
  </g>

  <line x1="500" y1="75" x2="600" y2="75" stroke="#7000ff" stroke-width="2" class="flow-beam"/>

  <!-- Step R: Reasoning -->
  <g transform="translate(610, 45)">
    <circle cx="30" cy="30" r="24" fill="#0d1526" stroke="#ff007a" stroke-width="1.5"/>
    <text x="30" y="38" fill="#ff007a" font-size="20" font-weight="900" text-anchor="middle" class="mono letter-pulse">R</text>
    <text x="30" y="80" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle" class="mono">Reasoning</text>
    <text x="30" y="105" fill="#8b949e" font-size="11" text-anchor="middle" class="mono">Cross-checking mistakes</text>
  </g>

  <line x1="690" y1="75" x2="790" y2="75" stroke="#38ef7d" stroke-width="2" class="flow-beam"/>

  <!-- Step O: One Answer -->
  <g transform="translate(800, 45)">
    <circle cx="30" cy="30" r="24" fill="#0d1526" stroke="#38ef7d" stroke-width="1.5"/>
    <text x="30" y="38" fill="#38ef7d" font-size="20" font-weight="900" text-anchor="middle" class="mono letter-pulse">O</text>
    <text x="30" y="80" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle" class="mono">One answer</text>
    <text x="30" y="105" fill="#8b949e" font-size="11" text-anchor="middle" class="mono">Clean verified diff</text>
  </g>
</svg>

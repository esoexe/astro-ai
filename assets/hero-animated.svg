<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="480">
  <defs>
    <radialGradient id="nebulaCore" cx="82%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.32"/>
      <stop offset="30%" stop-color="#7000ff" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#ff007a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#030508" stop-opacity="0.98"/>
    </radialGradient>
    <linearGradient id="orbitCyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#ff007a"/>
    </linearGradient>
    <linearGradient id="wireframeFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="matrixGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1" fill="rgba(0, 240, 255, 0.25)"/>
    </pattern>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .spin-gyro-outer { transform-origin: 940px 240px; animation: spinClockwise 28s linear infinite; }
      .spin-gyro-mid   { transform-origin: 940px 240px; animation: spinCounter 18s linear infinite; }
      .spin-gyro-inner { transform-origin: 940px 240px; animation: spinClockwise 11s linear infinite; }
      .radar-arm       { transform-origin: 940px 240px; animation: radarSweep 4.5s linear infinite; }
      .core-glow-pulse { animation: corePulse 3s ease-in-out infinite; }
      .packet-stream-1 { stroke-dasharray: 12 24; animation: flowStream 1.5s linear infinite; }
      .packet-stream-2 { stroke-dasharray: 8 16; animation: flowStreamRev 2s linear infinite; }
      .status-flicker  { animation: statusBlink 1.4s ease-in-out infinite alternate; }
      .scan-line       { animation: scanDown 4s ease-in-out infinite; }
      @keyframes spinClockwise { 100% { transform: rotate(360deg); } }
      @keyframes spinCounter   { 100% { transform: rotate(-360deg); } }
      @keyframes radarSweep    { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes corePulse     { 0%, 100% { r: 62px; opacity: 0.35; } 50% { r: 76px; opacity: 0.95; } }
      @keyframes flowStream    { to { stroke-dashoffset: -72; } }
      @keyframes flowStreamRev { to { stroke-dashoffset: 72; } }
      @keyframes statusBlink   { from { opacity: 0.25; } to { opacity: 1; } }
      @keyframes scanDown      { 0%, 100% { transform: translateY(0); opacity: 0; } 50% { transform: translateY(480px); opacity: 0.3; } }
    </style>
  </defs>
  <rect width="1200" height="480" fill="#030508" rx="14"/>
  <rect width="1200" height="480" fill="url(#nebulaCore)" rx="14"/>
  <rect width="1200" height="480" fill="url(#matrixGrid)" rx="14"/>
  <rect width="1200" height="480" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" rx="14"/>
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#00f0ff" stroke-width="2" class="scan-line"/>
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="310" height="30" rx="15" fill="rgba(0, 240, 255, 0.08)" stroke="rgba(0, 240, 255, 0.35)" stroke-width="1"/>
    <circle cx="18" cy="15" r="5" fill="#00f0ff" class="status-flicker"/>
    <text x="36" y="20" fill="#00f0ff" font-size="12" font-weight="700" class="mono" letter-spacing="1.2">ONE BRAIN // V2.0 PRODUCTION</text>
    <text x="0" y="105" fill="#ffffff" font-size="62" font-weight="900" class="sans" letter-spacing="-2">A.S.T.R.O  AI</text>
    <text x="0" y="148" fill="#00f0ff" font-size="16" font-weight="600" class="mono" letter-spacing="2">SOVEREIGN AUTONOMOUS AGENT WORKSPACE</text>
    <text x="0" y="195" fill="#94a3b8" font-size="14" class="mono">&#x25B9; ISO C++20 Core · Zero Python Runtime Overhead</text>
    <text x="0" y="222" fill="#94a3b8" font-size="14" class="mono">&#x25B9; 638 Neural Models Synchronized · One Brain Consensus</text>
    <text x="0" y="249" fill="#94a3b8" font-size="14" class="mono">&#x25B9; Native MCP Client · Real-Time AST Tree-sitter Code Graph</text>
    <g transform="translate(0, 290)">
      <rect width="130" height="34" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.15)"/>
      <text x="65" y="21" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle" class="mono">&lt; 8ms LATENCY</text>
      <rect x="144" width="140" height="34" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.15)"/>
      <text x="214" y="21" fill="#00f0ff" font-size="12" font-weight="600" text-anchor="middle" class="mono">32MB IDLE RAM</text>
      <rect x="298" width="130" height="34" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.15)"/>
      <text x="363" y="21" fill="#38ef7d" font-size="12" font-weight="600" text-anchor="middle" class="mono">TEST-HEALED</text>
    </g>
  </g>
  <g>
    <circle cx="940" cy="240" r="185" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    <circle cx="940" cy="240" r="185" fill="none" stroke="rgba(0, 240, 255, 0.15)" stroke-width="1" stroke-dasharray="4 28"/>
    <g class="spin-gyro-outer">
      <circle cx="940" cy="240" r="150" fill="none" stroke="url(#orbitCyanPurple)" stroke-width="2.5" stroke-dasharray="180 50 90 60"/>
      <circle cx="1090" cy="240" r="6" fill="#00f0ff"/>
      <circle cx="790" cy="240" r="4" fill="#ff007a"/>
    </g>
    <g class="spin-gyro-mid">
      <circle cx="940" cy="240" r="115" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="60 30 20 25"/>
      <circle cx="940" cy="125" r="5" fill="#7000ff"/>
      <circle cx="940" cy="355" r="4" fill="#00f0ff"/>
    </g>
    <g class="spin-gyro-inner">
      <circle cx="940" cy="240" r="82" fill="none" stroke="#38ef7d" stroke-width="1.5" stroke-dasharray="35 15 15 15"/>
    </g>
    <g class="radar-arm">
      <polygon points="940,240 860,60 1020,60" fill="url(#wireframeFade)" opacity="0.6"/>
      <line x1="940" y1="240" x2="940" y2="55" stroke="#00f0ff" stroke-width="2"/>
    </g>
    <circle cx="940" cy="240" r="68" fill="rgba(0, 240, 255, 0.15)" stroke="#00f0ff" stroke-width="2" class="core-glow-pulse"/>
    <circle cx="940" cy="240" r="22" fill="#ffffff"/>
    <line x1="940" y1="240" x2="720" y2="240" stroke="#00f0ff" stroke-width="2" class="packet-stream-1" opacity="0.75"/>
    <line x1="940" y1="240" x2="760" y2="340" stroke="#7000ff" stroke-width="1.5" class="packet-stream-2" opacity="0.6"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="560">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      
      /* UI Animations */
      .spin { transform-origin: 395px 125px; animation: rotate 2s linear infinite; }
      @keyframes rotate { 100% { transform: rotate(360deg); } }
      
      .type-line1 { animation: show1 8s infinite; }
      .type-line2 { animation: show2 8s infinite; }
      .type-line3 { animation: show3 8s infinite; }
      .type-line4 { animation: show4 8s infinite; }
      .test-badge { animation: testPass 8s infinite; }

      @keyframes show1 { 0%, 100% { opacity: 0; } 10%, 90% { opacity: 1; } }
      @keyframes show2 { 0%, 25% { opacity: 0; } 35%, 90% { opacity: 1; } }
      @keyframes show3 { 0%, 50% { opacity: 0; } 60%, 90% { opacity: 1; } }
      @keyframes show4 { 0%, 75% { opacity: 0; } 85%, 90% { opacity: 1; } }
      @keyframes testPass { 0%, 70% { opacity: 0; transform: scale(0.9); } 80%, 95% { opacity: 1; transform: scale(1); } }
      
      .pulse-dot { animation: pDot 1.4s infinite alternate; }
      @keyframes pDot { from { opacity: 0.3; } to { opacity: 1; } }
    </style>
  </defs>

  <!-- Main Window Frame -->
  <rect width="1000" height="560" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 990 0 C 995.5 0 1000 4.5 1000 10 L 1000 42 L 0 42 Z" fill="#161b22"/>
  <circle cx="22" cy="21" r="5.5" fill="#ff5f56"/>
  <circle cx="40" cy="21" r="5.5" fill="#ffbd2e"/>
  <circle cx="58" cy="21" r="5.5" fill="#27c93f"/>
  <text x="500" y="26" fill="#8b949e" font-size="12" font-weight="600" text-anchor="middle" class="mono">A.S.T.R.O AI · ~/projects/todo-api (Agent Mode)</text>

  <!-- Left Column: Sessions (Width: 240) -->
  <rect x="0" y="42" width="240" height="518" fill="#090d13" stroke="#21262d" stroke-width="1"/>
  <text x="20" y="75" fill="#8b949e" font-size="11" font-weight="700" class="mono">SESSIONS</text>
  <rect x="12" y="92" width="216" height="54" rx="6" fill="#161b22" stroke="#00f0ff" stroke-width="1"/>
  <circle cx="28" cy="112" r="4" fill="#00f0ff" class="pulse-dot"/>
  <text x="40" y="116" fill="#ffffff" font-size="12" font-weight="600" class="sans">Add auth route &amp; test</text>
  <text x="40" y="134" fill="#8b949e" font-size="11" class="mono">Working · Auto mode</text>

  <rect x="12" y="156" width="216" height="46" rx="6" fill="rgba(255,255,255,0.02)"/>
  <circle cx="28" cy="179" r="4" fill="#3fb950"/>
  <text x="40" y="183" fill="#c9d1d9" font-size="12" class="sans">Fix CORS headers</text>

  <!-- Center Column: Live Agent Run (Width: 500) -->
  <g transform="translate(260, 65)">
    <text x="0" y="20" fill="#ffffff" font-size="18" font-weight="700" class="sans">Add auth route &amp; test</text>
    <text x="0" y="44" fill="#8b949e" font-size="12" class="mono">Task: Add POST /login with JWT tokens and full test coverage</text>
    
    <!-- Step 1: Read Files -->
    <g transform="translate(0, 70)" class="type-line1">
      <circle cx="12" cy="12" r="10" fill="#1f293d"/>
      <path d="M 8 12 L 11 15 L 16 9" fill="none" stroke="#3fb950" stroke-width="2"/>
      <text x="32" y="16" fill="#c9d1d9" font-size="13" class="mono">Read src/server.js and src/routes/todos.js</text>
    </g>

    <!-- Step 2: Planning & Consensus -->
    <g transform="translate(0, 115)" class="type-line2">
      <circle cx="12" cy="12" r="10" fill="#1f293d"/>
      <path d="M 8 12 L 11 15 L 16 9" fill="none" stroke="#3fb950" stroke-width="2"/>
      <text x="32" y="16" fill="#c9d1d9" font-size="13" class="mono">One Brain consensus: 19 models locked plan</text>
    </g>

    <!-- Step 3: Write Route Code -->
    <g transform="translate(0, 160)" class="type-line3">
      <circle cx="12" cy="12" r="10" fill="#1f293d"/>
      <path d="M 8 12 L 11 15 L 16 9" fill="none" stroke="#3fb950" stroke-width="2"/>
      <text x="32" y="16" fill="#c9d1d9" font-size="13" class="mono">Wrote src/routes/auth.js (+48 lines)</text>
    </g>

    <!-- Step 4: Run Tests Live -->
    <g transform="translate(0, 205)" class="type-line4">
      <circle cx="12" cy="12" r="10" fill="#1f293d"/>
      <circle cx="12" cy="12" r="7" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="8 4" class="spin"/>
      <text x="32" y="16" fill="#00f0ff" font-size="13" class="mono">Running: npm test (routes/auth.test.js)</text>
    </g>

    <!-- Success Result Box -->
    <g transform="translate(0, 260)" class="test-badge">
      <rect width="460" height="70" rx="8" fill="rgba(63, 185, 80, 0.1)" stroke="#3fb950" stroke-width="1"/>
      <path d="M 24 35 L 32 43 L 46 27" fill="none" stroke="#3fb950" stroke-width="3"/>
      <text x="60" y="32" fill="#3fb950" font-size="14" font-weight="700" class="mono">All 14 unit tests passed</text>
      <text x="60" y="52" fill="#8b949e" font-size="12" class="mono">2 files modified · 0 errors · Checkpoint saved (Undo ready)</text>
    </g>
  </g>

  <!-- Right Column: Session Panel (Width: 220) -->
  <rect x="760" y="42" width="240" height="518" fill="#090d13" stroke="#21262d" stroke-width="1"/>
  <g transform="translate(780, 75)">
    <text x="0" y="0" fill="#8b949e" font-size="11" font-weight="700" class="mono">SESSION PANEL</text>
    <text x="0" y="30" fill="#c9d1d9" font-size="12" class="sans">Branch: <tspan fill="#00f0ff" class="mono">feat/auth</tspan></text>
    <text x="0" y="55" fill="#c9d1d9" font-size="12" class="sans">Context used: <tspan fill="#3fb950" class="mono">4.2k tokens</tspan></text>
    <text x="0" y="80" fill="#c9d1d9" font-size="12" class="sans">MCP Servers: <tspan fill="#00f0ff" class="mono">2 Active</tspan></text>

    <!-- Undo All Button -->
    <rect x="0" y="110" width="195" height="34" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="97" y="132" fill="#f85149" font-size="12" font-weight="600" text-anchor="middle" class="mono">↶ Undo All Changes</text>
  </g>
</svg>

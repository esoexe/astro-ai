# Builds the CLEAN desktop edition for Windows, Linux and macOS, and the Android app.
# Runs by hand (Actions > Desktop > Run workflow) or when a tag like v1.2.0 is pushed; tags also get a GitHub release.
#
# The WITH-KEYS edition is never built here (desktop/package.sh refuses it on CI).
#
# Optional code signing (see docs/signing.md). Without these settings the builds are unsigned:
#   Windows via SignPath (free for open source):  secret SIGNPATH_API_TOKEN, variable SIGNPATH_ORGANIZATION_ID
#                            (optional variables SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG)
#   Windows with your own certificate:  WINDOWS_CERT_PFX_BASE64, WINDOWS_CERT_PASSWORD
#   macOS (Developer ID):    MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY
#   macOS notarization:      APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
name: Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HAS_WIN_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make pkg-config zip unzip libcurl4-openssl-dev libssl-dev \
            libwebkit2gtk-4.1-dev g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 osslsigncode
      - name: Windows ARM64 toolchain (llvm-mingw + curl, checksums pinned)
        run: bash desktop/fetch_win_arm64.sh
      - name: Tests first
        run: make -j2 && make test
      - name: Build the CLEAN edition (Windows x64 + ARM64, Linux x64, macOS source kit)
        run: EDITIONS=clean bash desktop/package.sh
      # --- Windows signing, option 1: SignPath (the files go to SignPath and come back signed) ---
      - name: Collect Windows files for signing
        if: env.HAS_SIGNPATH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/unsigned" && cp desktop-builds/clean/*.exe desktop-builds/clean/*windows-*-portable*.zip "$RUNNER_TEMP/unsigned/"
          echo "ASTRO_VER=$(sed -n 's/^static const char\* VERSION = "\(.*\)";/\1/p' cli/astro.cpp)" >> "$GITHUB_ENV"
      - name: Upload unsigned Windows files
        id: unsigned
        if: env.HAS_SIGNPATH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned
          path: ${{ runner.temp }}/unsigned/
          retention-days: 1
      - name: Sign with SignPath
        if: env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'astro-ai' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signed
          parameters: |
            version: ${{ toJSON(env.ASTRO_VER) }}
      - name: Use the signed Windows files
        if: env.HAS_SIGNPATH == 'true'
        run: |
          ls -la "$RUNNER_TEMP/signed"
          cp -f "$RUNNER_TEMP/signed/"* desktop-builds/clean/
          for f in desktop-builds/clean/*.exe; do osslsigncode verify -in "$f" | grep -q "Signature verification: ok" || { echo "not signed: $f"; exit 1; }; done
      # --- Windows signing, option 2: your own code-signing certificate (.pfx) ---
      - name: Sign Windows installer
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        if: env.HAS_WIN_CERT == 'true' && env.HAS_SIGNPATH != 'true'
        run: |
          echo "$PFX" | base64 -d > "$RUNNER_TEMP/cert.pfx"
          for f in desktop-builds/clean/*.exe; do
            osslsigncode sign -pkcs12 "$RUNNER_TEMP/cert.pfx" -pass "$PFX_PASS" -n "A.S.T.R.O AI" -i "https://esoexe.github.io/astro-ai/" \
              -t http://timestamp.digicert.com -h sha256 -in "$f" -out "$f.signed" && mv "$f.signed" "$f"
          done
          rm -f "$RUNNER_TEMP/cert.pfx"
      - name: Nothing private in the output
        run: node tools/scan_secrets.js desktop-builds/clean
      - name: Checksums
        run: cd desktop-builds/clean && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: astro-ai-clean-windows-linux
          path: desktop-builds/clean/
          if-no-files-found: error

  linux-arm64:
    # Native build on GitHub's ARM runner (Raspberry Pi 4/5 with 64-bit OS, ARM laptops and servers)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make pkg-config zip unzip libcurl4-openssl-dev libssl-dev libwebkit2gtk-4.1-dev
      - name: Tests first
        run: make -j2 && make test
      - name: Build the CLEAN edition (Linux arm64)
        run: TARGETS=linux EDITIONS=clean bash desktop/package.sh
      - name: Nothing private in the output
        run: node tools/scan_secrets.js desktop-builds/clean
      - name: Checksums
        run: cd desktop-builds/clean && sha256sum * > SHA256SUMS-linux-arm64.txt && cat SHA256SUMS-linux-arm64.txt
      - uses: actions/upload-artifact@v7
        with:
          name: astro-ai-clean-linux-arm64
          path: desktop-builds/clean/
          if-no-files-found: error

  android:
    # Android app (arm64, Android 8.0+): the same C++ engine built with the NDK, inside a small WebView shell
    # (android/). Release APKs are signed with the project key from the ANDROID_KEYSTORE_BASE64 /
    # ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS secrets; the certificate must match android/signing-cert.sha256.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HAS_ANDROID_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      NDK_SHA1: 5107f898313790e449e87eee2183d9a20602dee9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.6.0
      - name: Android NDK r30 (checksum pinned)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ndk.zip" https://dl.google.com/android/repository/android-ndk-r30-linux.zip
          echo "$NDK_SHA1  $RUNNER_TEMP/ndk.zip" | sha1sum -c -
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP" && rm "$RUNNER_TEMP/ndk.zip"
          echo "ANDROID_NDK_ROOT=$RUNNER_TEMP/android-ndk-r30" >> "$GITHUB_ENV"
      - name: Build the engine (OpenSSL, curl and the engine from pinned sources)
        run: ASTRO_ANDROID_STATIC_TEST=1 JOBS=4 bash android/build_engine.sh
      - name: Test the engine (arm64, under qemu)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static
          bash android/test_engine_qemu.sh
      - name: Signing key
        if: env.HAS_ANDROID_KEY == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/astro-release.jks"
          echo "ASTRO_ANDROID_KEYSTORE=$RUNNER_TEMP/astro-release.jks" >> "$GITHUB_ENV"
      - name: Build the APK
        env:
          ASTRO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ASTRO_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ "$HAS_ANDROID_KEY" != true ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "A release needs the signing secrets." >&2; exit 1; fi
          gradle -p android --no-daemon assembleRelease assembleDebug
      - name: Check the signature and collect
        run: |
          VER=$(sed -n 's/^#define ASTRO_APP_VERSION "\(.*\)"/\1/p' platform.h)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p out
          if [ "$HAS_ANDROID_KEY" = true ]; then
            APK=android/app/build/outputs/apk/release/app-release.apk
            "$BT/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
            want=$(tr -d ':\n ' < android/signing-cert.sha256 | tr 'A-F' 'a-f')
            grep -qi "certificate SHA-256 digest: $want" "$RUNNER_TEMP/certs.txt" || { echo "Signing certificate does not match android/signing-cert.sha256" >&2; exit 1; }
            cp "$APK" "out/AstroAI-$VER-android-arm64-CLEAN.apk"
          else
            # No key (forks, manual runs): a debug build for testing only, never released.
            cp android/app/build/outputs/apk/debug/app-debug.apk "out/AstroAI-$VER-android-arm64-DEBUG-test-only.apk"
          fi
          node tools/scan_secrets.js out
          unzip -l out/*.apk | grep -Ei 'keys\.env|workspace\.env|gateway\.env|astro_auth' && { echo "Key file inside the APK" >&2; exit 1; } || true
          cd out && sha256sum * > SHA256SUMS-android.txt && cat SHA256SUMS-android.txt
      - uses: actions/upload-artifact@v7
        with:
          name: astro-ai-clean-android
          path: out/
          if-no-files-found: error

  macos:
    needs: windows-linux
    runs-on: macos-15
    timeout-minutes: 40
    env:
      HAS_MAC_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.MACOS_SIGN_IDENTITY != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.MACOS_SIGN_IDENTITY != '' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: astro-ai-clean-windows-linux
          path: kit
      - name: Import signing certificate
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.MACOS_CERT_PASSWORD }}
        if: env.HAS_MAC_CERT == 'true'
        run: |
          KC="$RUNNER_TEMP/build.keychain"; KP="$(uuidgen)"
          security create-keychain -p "$KP" "$KC"; security set-keychain-settings -lut 3600 "$KC"; security unlock-keychain -p "$KP" "$KC"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Build the app and disk image
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          tar -xzf kit/AstroAI-*-macos-source-CLEAN.tar.gz
          cd AstroAI-*-macos-source-CLEAN && ./build_mac.sh
          ver=$(basename "$PWD" | sed -E 's/AstroAI-(.*)-macos-source-CLEAN/\1/')
          mkdir -p ../out && mv "A.S.T.R.O AI Clean.dmg" "../out/AstroAI-$ver-macos-universal-CLEAN.dmg"
      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        if: env.HAS_NOTARY == 'true'
        run: |
          xcrun notarytool submit out/*.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple out/*.dmg
          spctl -a -t open --context context:primary-signature -v out/*.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: astro-ai-clean-macos
          path: out/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-linux, linux-arm64, android, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: files
          pattern: astro-ai-clean-*
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd files && cat SHA256SUMS-*.txt >> SHA256SUMS.txt && rm -f SHA256SUMS-*.txt && sha256sum *.dmg >> SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --title "A.S.T.R.O AI ${GITHUB_REF_NAME#v}" \
            --notes "Clean edition (no API keys). Changelog: https://esoexe.github.io/astro-ai/changelog.html"

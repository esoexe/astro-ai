# Sized for a 2 GB build machine. CI (.github/workflows/android.yml) raises the memory limits in the user-level
# gradle.properties, which takes precedence over this file.
org.gradle.jvmargs=-Xmx1000m -XX:MaxMetaspaceSize=320m -XX:ReservedCodeCacheSize=96m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.caching=false
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
android.nonTransitiveRClass=true
# Compile Kotlin inside the Gradle process: a separate Kotlin daemon does not fit in a 2 GB build machine.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
